<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Co-Thrive Labs logo candidate I: Cの帯幅を〇の直径(8.6)に揃えて統一感 -->
  <rect width="64" height="64" rx="14" fill="#6B8E5A"/>
  <!-- C: 真円弧(中心31,32 R19.72 開口右側)。stroke幅を〇直径8.6に合わせる -->
  <path d="M46.54 19.86 A19.72 19.72 0 1 0 46.54 44.14"
        stroke="#F8F6F0" stroke-width="8.6" stroke-linecap="round" fill="none"/>
  <!-- 基準の〇: 位置・サイズ・色は維持(直径8.6=Cの帯幅と一致) -->
  <circle cx="49.5" cy="32" r="4.3" fill="#C97B5E"/>
</svg>
