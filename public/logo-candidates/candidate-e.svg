  <path d="M46.54 19.86 A19.72 19.72 0 1 0 46.54 44.14"
        stroke="#F8F6F0" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- 開口側(右)に2粒: Cの中・上下 -->
  <rect x="42.78" y="21.05" width="7" height="7" rx="2" fill="#C97B5E"/>
  <rect x="42.78" y="35.95" width="7" height="7" rx="2" fill="#C97B5E"/>
  <!-- 背中側(左)に2粒: Cの外から支える -->
  <rect x="6.83" y="18.42" width="7" height="7" rx="2" fill="#C97B5E"/>
  <rect x="6.83" y="38.58" width="7" height="7" rx="2" fill="#C97B5E"/>
