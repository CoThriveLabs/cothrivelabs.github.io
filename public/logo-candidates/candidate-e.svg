<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Co-Thrive Labs logo candidate E: 太いC(真円弧)を角丸四角4粒が取り囲んで支え合う -->
  <!-- C: 中心(31,32) 半径19.72 真円弧、開口右側、stroke-width 8 -->
